# ScrapeAPI Docker Compose

version: '3.8'

services:
  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrapeapi-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
      - DATABASE_URL=postgresql+asyncpg://scrapeapi:scrapeapi@postgres:5432/scrapeapi
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - scrapeapi-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: scrapeapi-postgres
    environment:
      - POSTGRES_DB=scrapeapi
      - POSTGRES_USER=scrapeapi
      - POSTGRES_PASSWORD=scrapeapi123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapeapi -d scrapeapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scrapeapi-network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: scrapeapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scrapeapi-network

  # Redis Commander (Optional - for debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: scrapeapi-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - scrapeapi-network
    profiles:
      - debug

volumes:
  postgres-data:
  redis-data:

networks:
  scrapeapi-network:
    driver: bridge
